<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风止 Logo 预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:50px 20px;font-family:-apple-system,"PingFang SC","Noto Serif SC","Songti SC",serif;background:#0f0d18;color:#e8e0d0}
h1{text-align:center;font-weight:400;font-size:13px;letter-spacing:0.6em;margin-bottom:20px;color:#666}
h2{text-align:center;font-weight:300;font-size:36px;letter-spacing:0.4em;margin-bottom:50px;color:#d4c9b0;font-family:"Noto Serif SC","Songti SC",serif}
.section{margin-bottom:60px}
.gallery{display:flex;justify-content:center;gap:40px;flex-wrap:wrap}
.card{text-align:center}
.card h3{font-weight:400;margin-bottom:15px;font-size:12px;color:#999;letter-spacing:0.15em}
.box{width:340px;display:flex;align-items:center;justify-content:center;border-radius:4px;overflow:hidden;padding:30px}
.box img{max-width:100%;max-height:480px;object-fit:contain}
.checker{background-image:linear-gradient(45deg,#2a2a3a 25%,transparent 25%),linear-gradient(-45deg,#2a2a3a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a2a3a 75%),linear-gradient(-45deg,transparent 75%,#2a2a3a 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;background-color:#1e1e2e}
.paper{background:linear-gradient(160deg,#f5f0e5,#e8dfc8)}
.dark{background:linear-gradient(160deg,#1a1520,#0d0d18)}
.info{max-width:600px;margin:50px auto 0;padding:25px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;font-size:13px;color:#888;line-height:2}
.info code{background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:3px;font-family:"SF Mono",Consolas,monospace;color:#bbb;font-size:12px}
.info strong{color:#bbb;font-weight:500}
.notes{margin-top:15px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.06)}
</style>
</head>
<body>
<h1>風 止</h1>
<h2>标题书法 Logo</h2>

<div class="section">
  <div class="gallery">
    <div class="card">
      <h3>透明背景</h3>
      <div class="box checker"><img src="logo-transparent.png" alt="transparent"></div>
    </div>
    <div class="card">
      <h3>宣纸底色</h3>
      <div class="box paper"><img src="preview-paper-bg.png" alt="paper"></div>
    </div>
    <div class="card">
      <h3>墨色背景</h3>
      <div class="box dark"><img src="preview-dark-bg.png" alt="dark"></div>
    </div>
  </div>
</div>

<div class="info">
  <strong>字体</strong>：ZhiMangXing 志莽行书（奔放连笔 · SIL OFL 免费商用）<br>
  <strong>布局</strong>："风"左上↘"止"右下斜向排列，动态错落，微旋<br>
  <strong>效果</strong>：飞白干笔纹理 · 墨点溅墨 · 边缘墨晕 · 朱砂方印（斑驳做旧）<br>
  <strong>文件</strong>：<code>feng-zhi/assets/ui/title_logo_calligraphy.png</code> (1885×2576px 透明PNG)<br>
  <div class="notes">
    如需调整：倾斜角度、字间距/错开幅度、两字大小比例、墨色浓淡、印章大小位置，或换更狂放的草书（LiuJianMaoCao 刘建毛草），请告知。
  </div>
</div>
</body>
</html>
