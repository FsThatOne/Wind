  - id: TR-romance-system-001
    system: romance-system
    gdd: design/gdd/romance-system.md
    requirement: "感情系统必须在态度变化时根据最高已达成里程碑应用地板钳位，M_TRUST 后普通负面变化不得将态度降至 +1 以下，且被吞掉的负面 delta 必须记录审计信息；感情数据由 NPC State 拥有，Romance 仅拥有规则逻辑"
    created: 2026-06-13
    revised: ""
    status: active

  - id: TR-romance-system-002
    system: romance-system
    gdd: design/gdd/romance-system.md
    requirement: "感情系统必须按 M_ACQUAINTED → M_TRUST → M_CRISIS → M_HEART → M_BOND 顺序解锁里程碑，禁止跳级；解锁门槛为 Trust≥1、Crisis≥1、Heart≥2、Bond≥2；force_break 必须无视地板与顺序，直接设置 M_BREAK 并将态度设为 -4，且 M_BREAK 后该 NPC 不再参与普通感情判定"
    created: 2026-06-13
    revised: ""
    status: active

  - id: TR-romance-system-003
    system: romance-system
    gdd: design/gdd/romance-system.md
    requirement: "感情系统必须保证同一周目最多结缘一人；TryBond 在条件满足时只能返回 AwaitingChoice，不得直接确认结缘；ConfirmBond 必须设置该 NPC 的 M_BOND 并写入全局 bonded_heroine；已结缘后其他女主结缘节点必须返回 already_bonded 变体；DeclineBond 必须写入 romance_bond_declined_{npcId} flag，使同一结缘节点后续不再重复触发"
    created: 2026-06-13
    revised: ""
    status: active

  - id: TR-romance-system-004
    system: romance-system
    gdd: design/gdd/romance-system.md
    requirement: "感情系统的结局变体解析必须优先处理 morality <= -30 的魔道结局 override，且该 override 不受 bonded_heroine 影响；非魔道且未结缘时必须返回 solo 变体；非魔道且已结缘时必须按心境兼容性返回 companion 或 farewell 变体；旁白语气可由 morality 派生但不得改变结局分支身份"
    created: 2026-06-13
    revised: ""
    status: active

  - id: TR-romance-system-005
    system: romance-system
    gdd: design/gdd/romance-system.md
    requirement: "感情系统必须追踪暗号、书信、传闻和偶遇四类彗星存在感计数，并将计数写回 NPC State 的 RomanceData；传闻触发概率必须按 base(0.3) + same_region(+0.4) + absence>7天(+0.2) 计算并 Clamp 到 [0, 0.8]；暗号和书信触发必须更新 romance_last_contact_{npcId} 供存档读取后续算"
    created: 2026-06-13
    revised: ""
    status: active

  - id: TR-romance-system-006
    system: romance-system
    gdd: design/gdd/romance-system.md
    requirement: "感情系统必须在保存/加载后恢复 romance_last_contact_{npcId} 并按当前世界日续算 days_since_last_contact；全局 bonded_heroine 必须可保存和恢复；新周目初始化必须清空感情里程碑、结缘状态、彗星存在感计数和 last-contact 标志，且不得误清非感情 NPC State 字段"
    created: 2026-06-13
    revised: ""
    status: active

  - id: TR-romance-system-007
    system: romance-system
    gdd: design/gdd/romance-system.md
    requirement: "感情系统必须向 UI/人物图鉴提供文学化关系展示契约；输出不得包含好感度数字、进度条、攻略进度百分比、内部里程碑 enum/flag 名称或结缘状态直白提示；各态度档位与已达成里程碑组合必须能映射为文学化描述 key、tone tag 和回忆片段 id，供 Presentation 层渲染但不暴露内部数值与状态实现细节"
    created: 2026-06-14
    revised: ""
    status: active

  - id: TR-combat-ui-001
    system: combat-ui
    gdd: design/gdd/combat-ui.md
    requirement: "战斗 UI 必须建立 WorldIntentLayer 与 HUDLayer 两个 CanvasLayer 底座，将战斗事件适配为只读 UI 快照，按 INACTIVE → ROUND_START → PLAYER_DECISION → RESOLVING → ROUND_END → BATTLE_END 状态流推进，并通过脏标记刷新呈现 Core Combat 与 MartialArts 的结果而不拥有战斗结算逻辑"
    created: 2026-06-14
    revised: ""
    status: active

  - id: TR-combat-ui-002
    system: combat-ui
    gdd: design/gdd/combat-ui.md
    requirement: "战斗 UI 必须在 OnIntentRevealed 后于 WorldIntentLayer 敌方头顶槽位与 HUDLayer 汇总区同步展示敌方意图；刚/柔/巧/未知必须分别以可区分图标呈现，未知意图不得泄露真实体系；未知转已识破必须有过渡动画；已落败目标收到意图事件时必须安全消隐或变暗且不得访问已释放节点；多敌人同时刷新时 HUD 汇总顺序必须稳定"
    created: 2026-06-14
    revised: ""
    status: active

  - id: TR-combat-ui-003
    system: combat-ui
    gdd: design/gdd/combat-ui.md
    requirement: "战斗 UI 必须展示所有参战角色的气血、内息与破绽状态；气血受击必须先闪白再平滑扣减，内息变化必须即时可见；破绽达到 5 时必须显示深红脉冲与“破绽！”浮字；伤害数字必须按克制、同系、被克、暴击、一击决胜使用可区分样式；同帧多个伤害事件不得丢失或重叠到不可读；UI 不得计算伤害或显示伤害预测数字。"
    created: 2026-06-14
    revised: ""
    status: active

  - id: TR-combat-ui-004
    system: combat-ui
    gdd: design/gdd/combat-ui.md
    requirement: "战斗 UI 必须在玩家行动阶段展示招式选择面板，包含 6 个装备招式、调息、普通攻击和使用道具；招式格必须显示名称、体系、内息消耗、触发条件和效果摘要，心法专属招式显示角标；不可用行动必须置灰并显示原因；聚焦或悬停时预览卡只显示体系关系和反制提示，不得显示伤害预测、胜率、期望值或结算结果；面板打开时默认聚焦第一个可用行动，资源刷新不得中断交互。"
    created: 2026-06-14
    revised: ""
    status: active

  - id: TR-combat-ui-005
    system: combat-ui
    gdd: design/gdd/combat-ui.md
    requirement: "战斗 UI 必须在招式选择面板中呈现反制与决胜窗口：当选中招式体系克制目标公开意图且内息 >= 3 时显示金色“反制”标签，内息不足时显示置灰“反制 / 内息不足”；确认反制行动时 UI 仅向战斗系统提交 isCounter=true，不执行扣费、伤害或破绽结算；当当前目标破绽 >= 5 时面板顶部插入可聚焦的“决胜一击”高亮行，多目标达标时随目标切换刷新提示；面板打开期间内息变化必须即时刷新反制可用状态。"
    created: 2026-06-15
    revised: ""
    status: active

  - id: TR-combat-ui-006
    system: combat-ui
    gdd: design/gdd/combat-ui.md
    requirement: "战斗 UI 必须通过 CombatAnimationDirector 编排一击决胜的 7 阶段演出：接收 Core 预结算结果、Engine.TimeScale 慢进至 0.2 约 0.3s、Camera2D 推进并锁定目标、播放刚/柔/巧体系专属动画入口、最大尺寸深金一击决胜伤害浮字、TimeScale 慢出恢复至 1.0、Camera 归位并恢复默认跟随；TimeScale 控制必须通过 TimeScaleController 优先级栈（决胜优先级 50），修改 TimeScale 的 Tween 必须使用 Tween.TweenProcessMode.Always 以避免自锁；Camera 控制必须通过 CameraRequestBus（决胜优先级 50），演出期间禁用 Camera smoothing 并在归位后重新启用；演出期间必须通过战斗 cinematic lock 屏蔽玩家输入且不得通过破坏 InputMap 实现；决胜演出默认不可跳过；暂停或更高优先级 TimeScale 请求释放后演出必须能继续并正确恢复，演出结束后 TimeScale、Camera、输入锁必须恢复正常。"
    created: 2026-06-18
    revised: ""
    status: active

  - id: TR-combat-ui-007
    system: combat-ui
    gdd: design/gdd/combat-ui.md
    requirement: "战斗 UI 必须在多人战斗中提供协同与回合警戒反馈：当同一回合内两名己方角色对同一目标使用克制目标体系的招式时，UI 必须在目标头顶显示金色双拳『协同！』浮字，并与伤害数字同时可见；非同目标或非克制场景必须不出现『协同！』；UI 不得自行判定协同收益或修改战斗结算，协同成立由战斗系统事件/结算快照提供；HUD 右上角必须显示当前回合数，第 12 回合计数变橙色，第 14 回合计数变红色，颜色变化必须不影响其他 HUD 信息可读性，也不得修改战斗节奏。"
    created: 2026-06-18
    revised: ""
    status: active

  - id: TR-combat-ui-008
    system: combat-ui
    gdd: design/gdd/combat-ui.md
    requirement: "战斗招式面板和关键提示必须支持键盘、鼠标和手柄完整操作：面板打开时默认聚焦第一个可用行动，D-pad/摇杆可上下导航所有可交互行动，导航必须在面板内循环且焦点不得逃出面板；A/确认键必须提交当前聚焦行动；反制和决胜一击行必须可通过手柄导航触达；Godot 4.6 dual-focus 下鼠标 hover 与手柄焦点必须可同时独立存在且视觉不冲突，输入模式切换后焦点高亮规则必须保持正确。"
    created: 2026-06-15
    revised: ""
    status: active

  - id: TR-exploration-insight-001
    system: exploration-insight
    gdd: design/gdd/exploration-insight.md
    requirement: "探索/洞察系统必须定义 InsightNode 数据模型、DiscoveryState 状态和场景节点注册表；场景加载时只激活当前 scene_id 的节点，已 INVESTIGATED 且 one_time=true 的节点不得再次注册，场景卸载时 DETECTED/IGNORED 瞬态状态必须回退为 UNDISCOVERED"
    created: 2026-06-14
    revised: ""
    status: active

  - id: TR-exploration-insight-002
    system: exploration-insight
    gdd: design/gdd/exploration-insight.md
    requirement: "探索/洞察系统必须在玩家进入 detection_radius 时实时评估 prerequisite 与 insight_threshold，并按 player.insight >= node.insight_threshold 的纯布尔规则显示水墨提示；insight 不足时不得显示任何提示，角色洞察提升后重访同一位置必须可重新检定并发现"
    created: 2026-06-14
    revised: ""
    status: active

  - id: TR-exploration-insight-003
    system: exploration-insight
    gdd: design/gdd/exploration-insight.md
    requirement: "探索/洞察系统必须在多个 InsightNode 同时进入范围时按距离近到远依次触发，并遵守 multi_node_stagger 间隔；提示出现后超过 insight_cue_linger 未追查必须自动隐藏并转为 IGNORED，玩家离开后再次接近必须可重新提示"
    created: 2026-06-14
    revised: ""
    status: active

  - id: TR-exploration-insight-004
    system: exploration-insight
    gdd: design/gdd/exploration-insight.md
    requirement: "探索/洞察系统必须通过 DiscoveryDispatcher 播放 narrative_context 独白并按 discovery_type 分派奖励；Clue 节点必须正确设置主线叙事 quest_flag，CodePhrase 节点必须写入暗号簿，完成追查后必须标记 INVESTIGATED 并发布发现事件"
    created: 2026-06-14
    revised: ""
    status: active

  - id: TR-exploration-insight-005
    system: exploration-insight
    gdd: design/gdd/exploration-insight.md
    requirement: "探索/洞察系统必须只持久化 INVESTIGATED 终态；存档加载后已发现节点保持 INVESTIGATED 且不重复触发，DETECTED/IGNORED 不得持久化；战斗、对话或 LockMode >= Partial 期间必须暂停检测并隐藏提示，锁释放后若玩家仍在范围内必须恢复检测"
    created: 2026-06-14
    revised: ""
    status: active

