# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: string_based_signal_connect
    status: active
    description: "禁止使用 string-based Connect('signal_name', callable)。必须使用 [Signal] delegate + C# event 语法 (+=)"
    why: "Godot 4.5+ 已废弃 string-based 连接；无类型安全；编译期不检查拼写错误"
    adr: docs/architecture/adr-0001-event-bus-architecture.md
    added: 2026-06-08

  - pattern: direct_cross_layer_reference
    status: active
    description: "下层模块禁止直接引用上层模块。跨层通信必须通过 EventBus 事件"
    why: "破坏分层隔离；造成循环依赖；使下层模块不可独立测试"
    adr: docs/architecture/adr-0001-event-bus-architecture.md
    added: 2026-06-08

  - pattern: hover_only_interaction
    status: active
    description: "所有可交互 UI 元素禁止仅依赖鼠标 hover。必须设置 focus_mode = FOCUS_ALL 支持键盘/手柄导航"
    why: "Steam Deck 手柄操作无法触发 hover；违反 accessibility 要求"
    adr: docs/architecture/adr-0002-ui-framework-dual-focus.md
    added: 2026-06-08

  - pattern: synchronous_scene_load
    status: active
    description: "禁止在主线程同步加载场景 (PackedScene.Instantiate 阻塞)。必须使用 ResourceLoader 异步加载"
    why: "54 场景中任意 >50ms 的同步加载都会造成可感知卡顿"
    adr: docs/architecture/adr-0006-scene-loading-strategy.md
    added: 2026-06-08

  - pattern: hardcoded_dialogue_strings
    status: active
    description: "对话文本禁止硬编码在 C# 代码中。所有对话必须存储在 assets/data/dialogue/ YAML 文件中"
    why: "12-15万字叙事无法在代码中维护；破坏翻译和版本控制工作流"
    adr: docs/architecture/adr-0005-dialogue-format.md
    added: 2026-06-08

  - pattern: direct_audiostream_play_for_bgm
    status: active
    description: "BGM 播放禁止直接调用 AudioStreamPlayer.Play()。必须通过 AudioStateMachine 管理状态转换和 crossfade"
    why: "绕过状态机会破坏 crossfade、Override 栈和小节线对齐逻辑"
    adr: docs/architecture/adr-0009-dynamic-audio.md
    added: 2026-06-08

