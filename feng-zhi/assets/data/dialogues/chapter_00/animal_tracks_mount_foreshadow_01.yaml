id: animal_tracks_mount_foreshadow_01
version: 1
entry_node: tracks_01
nodes:
  - id: tracks_01
    type: narration
    text: "溪边湿泥上印着一串小而清楚的蹄印，绕过石脉，又轻轻折进草丛。"
    next: player_01

  - id: player_01
    type: speech
    speaker: player
    text: "这是什么留下的？看着不像山兔。"
    next: sister_01

  - id: sister_01
    type: speech
    speaker: bai_tan
    text: "是小鹿一类的山兽。脚步轻，胆子也小，大概是清晨来溪边饮水。"
    next: sister_02

  - id: sister_02
    type: speech
    speaker: bai_tan
    text: "世间有些动物通人性，若真养熟了，能驮人走很远的路。不过你先把自己这两条腿走稳再说。"
    next: player_02

  - id: player_02
    type: speech
    speaker: player
    text: "等我以后有了坐骑，一定先驮你去看山外最大的集市。"
    next: sister_03

  - id: sister_03
    type: speech
    speaker: bai_tan
    text: "好啊。那我先等你今日别把药篓背歪。"
    events:
      - type: quest_flag
        key: prologue_gathering_taught
        value: "true"
      - type: quest_flag
        key: prologue_mount_foreshadowed
        value: "true"
    next: END
