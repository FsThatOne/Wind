id: manor_errands_01
version: 1
entry_node: opening_01
nodes:
  - id: opening_01
    type: narration
    text: "回到山庄时，前院已经热闹起来。厨房蒸汽绕着屋檐，药房门口晒着新草，练武场边挂起了寿宴用的红绳。"
    next: choose_route

  - id: choose_route
    type: choice
    prompt: "先答应哪边的催促？"
    options:
      - text: "去厨房送药草。"
        next: kitchen_hint
      - text: "去药房分拣药包。"
        next: pharmacy_hint
      - text: "去练武场给师弟传话。"
        next: training_ground_hint

  - id: kitchen_hint
    type: speech
    speaker: kitchen_disciple
    text: "来得正好！醒酒汤要用的草药还在厨房仓房小潭的晾架上，等你亲自送来。"
    next: task_accept

  - id: pharmacy_hint
    type: speech
    speaker: pharmacy_disciple
    text: "药包还没分好。白芷放左边，碎矿粉放右边，你去药锅旁边那摞帮我理一理。"
    next: task_accept

  - id: training_ground_hint
    type: speech
    speaker: junior_brother
    text: "你终于回来了！师姐让我找寿宴红绳，我只找见一截绑木桩的旧绳。你等会儿过来告诉我正经红绳在哪儿。"
    next: task_accept

  - id: task_accept
    type: inner_monologue
    text: "你应得很快：厨房要药草，药房要分包，师弟还等着红绳的位置。三件事都不难，只是得亲自跑一趟。"
    events:
      - type: quest_flag
        key: prologue_manor_errands_started
        value: "true"
    next: END
