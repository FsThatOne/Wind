    expression: "counter_read_chance × (1 - cooldown_penalty)"
    notes: "DEPRECATED 2026-06-16 — old hidden counter-read mechanic. Enemy AI may adapt only through visible tell, movement, current qi, cooldown, target choice, and already-observed player history."
    # OLD: output_range [0,60], boss 40-60% — boss max reduced to 25% (Phase 3b), tuning cap 40%
    added: 2026-06-02
    revised: "2026-06-16"

