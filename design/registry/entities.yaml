      - kill_bonus
      - threat_bonus
      - spread_penalty
    output_range: [-20, 200]
    expression: "decisive_bonus + kill_bonus + threat_bonus + spread_penalty"
    notes: "DEPRECATED 2026-06-16 — old target-only priority formula. Replaced by separate enemy move_score and action_score formulas in enemy-ai.md."
    # OLD: output_range [-20, 180] was wrong — threat_bonus caps at 50, not 30
    added: 2026-06-02
    revised: "2026-06-16"

  - name: enemy_move_score
    status: active
    source: design/gdd/enemy-ai.md
    referenced_by:
      - design/gdd/enemy-ai.md
      - design/gdd/combat-system.md
    variables:
      - target_access_score
      - facing_score
      - safety_score
      - personality_position_score
      - objective_score
    output_range: [-999, 999]
    expression: "target_access_score + facing_score + safety_score + personality_position_score + objective_score"
    notes: "行气战棋 AI movement scoring. Scores legal board cells only."
    added: 2026-06-16
    revised: ""

  - name: enemy_action_score
    status: active
    source: design/gdd/enemy-ai.md
    referenced_by:
