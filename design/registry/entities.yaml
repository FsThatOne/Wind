      - design/gdd/combat-system.md
    variables:
      - damage_score
      - stagger_score
      - qi_advantage_score
      - resource_score
      - cooldown_score
      - personality_action_score
      - boss_script_score
    output_range: [-999, 999]
    expression: "damage_score + stagger_score + qi_advantage_score + resource_score + cooldown_score + personality_action_score + boss_script_score"
    notes: "行气战棋 AI action scoring after a legal move cell is considered."
    added: 2026-06-16
    revised: ""

  - name: power_comparison
    status: active
    source: design/gdd/character-attributes.md
    referenced_by:
      - design/gdd/character-attributes.md
    variables:
      - self_total_power
      - target_total_power
    output_range: [0, 999]
    expression: "self.total_power / target.total_power → 5-level scale"
    notes: "<0.5=远弱, 0.5-0.8=弱, 0.8-1.2=相当, 1.2-2.0=强, >2.0=远强"
    added: 2026-06-02
    revised: ""

